<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Css/register&login-Css/login.css"> 
</head>
<body>
    <div id="wrapper">
        <div class="card-container">
            <!-- Blue side container -->
             <div id="RHS-container">
                <h1>Hello Welcome!</h1>
                <p>Don't have an account</p>
                <button type="submit" class="register-btn">
                    Register
                </button>
             </div>
            <div id="LHS-container">
                <h1>Login</h1>
            </div>
            <div class="forms-group">
                <!-- Username -->
                    <label for="username">Username:</label>
                    <input type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    Required>
                    <img src="../Images/SVG/login-page/user_icon.svg" class="user-icon"alt="user Icon">
                    <!-- password -->
                    <br>
                    <label for="password">Password:</label>
                    <input type="password"
                    for="password"
                    id="password"
                    placeholder="Enter your password "
                    required>
                    <img src="../Images/SVG/login-page/lock_icon.svg" class="lock-icon" alt="lock-icon" >

                <div id="login-btn">
                <button type="submit">Login</button>
                </div>

                <p>or login with social platforms </p>

                <div class="social-container-login">
                <img src="../Images/SVG/login-page/google_icon.svg" class="social-icon-login" alt="google">

                <img src="../Images/SVG/login-page/microsoft-icon.svg" class="social-icon-login" alt="microsoft">

                <img src="../Images/SVG/login-page/facebook_icon.svg" class="social-icon-login" alt="facebook">

                <img src="../Images/SVG/login-page/linkedin-icon.svg" class="social-icon-login"
                alt="linkedin">

            </div>
        </div>
    </div>
</body>
</html>
