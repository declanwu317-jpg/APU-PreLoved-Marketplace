<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - APU Pre-Loved Marketplace</title>
    <link rel="stylesheet" href="../Css/Login-Css/login.css"> 
</head>
<body>
    <div id="wrapper">
        <div class="Login-container" >
             <div id="within-container">
                <h2>Welcome Back!</h2>
                <p class="auth-label">Already have an account?
                </p>
                <button class="login" type="submit">Login</button>
            </div>
            <h1>Registration</h1>
            <form>
                <div class="form-group">
                    <!-- USERNAME -->
                    <label for="username">Username:</label>
                    <br>
                    <input type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required>
                    <img src="../Images/SVG/Login Page/user_icon.svg" class="input-icon" alt="User Icon"> 
                <br>
                    <!-- EMAIL -->
                <br>
                     <label for="email">Email: </label>
                     <br>
                     <input
                     type="email"
                     id="email"
                     name="email"
                     placeholder="Enter your email"
                     required>  
                     <img src="../Images/SVG/Login Page/email_icon.svg" class="Email-icon" alt="Email Icon">
                <br>
                <!-- PASSWORD -->
                <br>
                 <label for="password">Password: </label>
                 <br>
                 <input
                 type="password"
                 id="password"
                 name="password"
                 placeholder="Enter your password"
                 required>
                 <img src="../Images/SVG/Login Page/lock_icon.svg" class="lock-icon" alt="Lock Icon">
                </div>
                <br>
            </form>
            <button type="submit" class="register-btn">Register</button>
            <h6>Or register with other social platforms</h6>
            <div class="social-container">
                <img src="../Images/SVG/Login Page/google_icon.svg" class="social-icon" alt="Google">

                <img src="../Images/SVG/Login Page/microsoft-icon.svg" class="social-icon" alt="microsoft">

                <img src="../Images/SVG/Login Page/facebook_icon.svg" class="social-icon"
                alt="facebook">

                <img src="../Images/SVG/Login Page/linkedin-icon.svg" class="social-icon"
                alt="linkedin">
            </div>
        </div>
    </div>
</body>
</html>
